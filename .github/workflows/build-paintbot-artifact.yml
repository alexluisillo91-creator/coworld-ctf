name: Build Paintbot policy artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build linux/amd64 baseline policy
        run: >-
          docker build
          --platform linux/amd64
          --file players/baseline/Dockerfile
          --tag paintbot-player:baseline-aug11
          .

      - name: Export Docker archive
        run: docker image save paintbot-player:baseline-aug11 --output paintbot-player.tar

      - name: Upload policy archive
        uses: actions/upload-artifact@v4
        with:
          name: paintbot-player-linux-amd64
          path: paintbot-player.tar
          if-no-files-found: error
          retention-days: 3

